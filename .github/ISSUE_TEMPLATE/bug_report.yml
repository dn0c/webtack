name: Bug Report
description: Create a report to help us improve WebTack
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you have checked existing issues before filing a new one.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of WebTack is affected?
      options:
        - CLI (curate.py)
        - Web Viewer & Reader (viewer.py)
        - Model Context Protocol (webtack_mcp.py)
        - Exporter (curate.py export / export.html)
        - Enrichment (scripts/enrich.py)
        - Schema & Validation (atom.schema.json / curate.py validate)
        - macOS Launcher (Launch WebTack.command)
        - Documentation / Specification
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands or browser actions to reproduce the behavior.
      placeholder: |
        1. Run `python3 curate.py save "https://..."`
        2. Inspect output
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System & Version
      placeholder: macOS 14.5 Sonoma / Ubuntu 22.04 / Windows 11 WSL2
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: e.g. Python 3.12.3
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs & Error Traceback
      description: Paste any terminal output or stack traces here. (Please sanitize sensitive URLs or tokens).
      render: shell
