[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webtack"
version = "3.0.0"
description = "A new open-source framework for saving and storing content from the web."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Drew Shannon", email = "andrew.w.shannon@gmail.com"}
]
keywords = [
    "bookmarks",
    "curation",
    "local-first",
    "content-sidecar",
    "reading-list",
    "knowledge-management",
    "mcp",
    "llms"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities"
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "trafilatura>=2.0.0",
    "blurhash-python>=1.2.0",
    "mcp>=2.0.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
    "openai>=1.0.0"
]

[project.urls]
Homepage = "https://webtack.net"
Documentation = "https://github.com/dn0c/webtack#readme"
Repository = "https://github.com/dn0c/webtack"
Issues = "https://github.com/dn0c/webtack/issues"
Specification = "https://github.com/dn0c/webtack/blob/main/SPECIFICATION.md"

[project.scripts]
webtack = "curate:main"

[tool.setuptools]
py-modules = ["curate", "viewer", "webtack_mcp"]

[tool.setuptools.packages.find]
include = ["integrations*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.html", "*.md"]

